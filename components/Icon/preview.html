<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../tokens/tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../../vendor/react.production.min.js"></script><script src="../../vendor/react-dom.production.min.js"></script><script src="../bundle.js"></script><meta charset="utf-8"><title>Icon</title></head>
<body style="margin:0;padding:16px;font-family:var(--font-sans);color:var(--text);background:var(--white);">

<script>
  var G = window.GBIF, h = React.createElement;
  ReactDOM.createRoot(document.getElementById("root")).render(h(React.Fragment, null, h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(92px,1fr))',gap:12,font:'11px var(--font-sans)',color:'var(--text-muted)'}},G.iconNames.filter(function(n){return n.indexOf('gbif')<0}).map(function(n){return h('div',{key:n,style:{display:'grid',justifyItems:'center',gap:6}},h('span',{style:{color:['occurrences','datasets','species','publishers','news','events','data-use','projects','programmes','tools','documents','pages','resources'].indexOf(n)>=0?'var(--brand)':'var(--text)'}},h(G.Icon,{name:n,size:24})),n)}))));
</script>
<script>(function(){function s(){parent.postMessage({dsPreview:location.pathname,h:document.documentElement.scrollHeight},"*")}new ResizeObserver(s).observe(document.body);addEventListener("load",s);setTimeout(s,300)})();</script></body></html>
